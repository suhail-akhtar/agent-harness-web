# harness-web in Docker (any OS). The source is mounted, so edits apply on restart;
# node_modules stays in a volume so its native binaries are Linux ones.
#
#   docker compose build
#   docker compose run --rm harness npm ci          # once, and after dependency changes
#   docker compose run --rm harness npm test
#   docker compose up                               # the server on http://127.0.0.1:4310
#
# API keys pass through from your shell's environment; nothing is stored here.
# Sessions in the container use the "Server folder" runtime on /work
# (HARNESS_WORK on the host, default ./.work); the container is the isolation.
services:
  harness:
    build: { context: docker, dockerfile: Dockerfile.harness }
    image: harness-web:dev
    working_dir: /app
    environment:
      HARNESS_HOST: 0.0.0.0
      HARNESS_DATA: /data
      HARNESS_LOCAL_ROOTS: /work
      ANTHROPIC_API_KEY:
      GW_ANTHROPIC_API_KEY:
      DEEPSEEK_API_KEY:
      OPENAI_API_KEY:
      HARNESS_TOKEN:
    ports: ["127.0.0.1:4310:4310"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - data:/data
      - ${HARNESS_WORK:-./.work}:/work
volumes:
  node_modules:
  data:
