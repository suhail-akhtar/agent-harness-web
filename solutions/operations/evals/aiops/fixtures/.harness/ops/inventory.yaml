# The AIOps test stack (evals/aiops/stack): a shop API in a container on this
# machine, a database host reached over ssh, Prometheus. The host db-1, the
# monitoring endpoints and their credentials are the operator's
# (evals/aiops/stack/operator-inventory.yaml, HARNESS_OPS_INVENTORY): a
# workspace inventory names services, alerts and windows, never credentials (nor
# a read-only account: db-1's is the operator's too).
services:
  - name: shop-api
    host: local
    env: prod
    container: hwtest-aiops-demoapp
    health: http://127.0.0.1:19180/health
    tls: https://127.0.0.1:19443
    metrics_job: demoapp
    logs: { docker: hwtest-aiops-demoapp }
    owner: team-shop
    depends_on: [db-1]
    notes: "The orders database is files on db-1's /data volume, which this container shares (db-1:/data/app/README.txt says how it is maintained)."
    slos:
      - name: availability
        objective: 99.5
        window: 1d
        errors: sum(rate(http_requests_total{job="demoapp",route=~"/api/.*",code=~"5.."}[{{window}}]))
        total: sum(rate(http_requests_total{job="demoapp",route=~"/api/.*"}[{{window}}]))
      - name: orders-latency
        objective: 99
        window: 1d
        errors: sum(rate(http_request_duration_seconds_count{job="demoapp",route="/api/orders"}[{{window}}])) - sum(rate(http_request_duration_seconds_bucket{job="demoapp",route="/api/orders",le="0.5"}[{{window}}]))
        total: sum(rate(http_request_duration_seconds_count{job="demoapp",route="/api/orders"}[{{window}}]))
  - name: billing-worker
    host: db-1
    env: prod
    notes: "A plain process on db-1 (/usr/local/bin/billing-worker, run by ops); db-1 has no systemd."
    owner: team-billing

maintenance:
  - name: sunday-night
    env: prod
    cron: "0 2 * * 0"
    duration: 2h

alerts:
  - name: ShopOrdersLatencyHigh
    expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="demoapp",route="/api/orders"}[30s]))) > 0.5
    for: 15s
    severity: critical
    service: shop-api
    summary: p95 latency of GET /api/orders over 500 ms
  - name: ShopErrorRatio
    expr: sum(rate(http_requests_total{job="demoapp",code=~"5.."}[1m])) / sum(rate(http_requests_total{job="demoapp"}[1m])) > 0.05
    for: 30s
    severity: critical
    service: shop-api
  - name: ShopDataVolumeFull
    expr: demo_data_free_bytes{job="demoapp"} / demo_data_size_bytes{job="demoapp"} < 0.1
    severity: critical
    service: shop-api
  - name: ShopWorkerDown
    expr: demo_worker_up{job="demoapp"} == 0
    for: 20s
    severity: warning
    service: shop-api
  - name: ShopMemoryHigh
    expr: process_resident_memory_bytes{job="demoapp"} > 400e6
    for: 1m
    severity: warning
    service: shop-api
  - name: ShopTargetDown
    expr: up{job="demoapp"} == 0
    for: 30s
    severity: critical
    service: shop-api
