name="Harness Bridge"
description="Lets the harness's agents work in this open editor: the scene tree, adding and changing nodes, running GDScript, play and stop, viewport captures. A WebSocket on 127.0.0.1 only, with a token written to .godot/harness_bridge.json."
author="engine-godot"
version="1.0"
script="plugin.gd"
