<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layer Run</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1117; display: grid; place-items: center; }
  #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
</style>
<!-- Three.js from vendor/three (studio_template vendors it; nothing loads from the network). -->
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
<script>
  // Opened from its file (file://): browsers refuse the game's modules and data there. Say how to play it.
  if (location.protocol === 'file:') addEventListener('DOMContentLoaded', () => {
    const d = document.createElement('div');
    d.setAttribute('data-file-note', '');
    d.style.cssText = 'position:fixed;inset:auto 16px 16px 16px;max-width:640px;margin:auto;padding:14px 16px;border-radius:10px;background:#1c2230;color:#e6e9ef;font:14px/1.5 system-ui,sans-serif;box-shadow:0 6px 24px #0008;z-index:9';
    d.textContent = 'This game runs from a web address, not from its file: browsers block its scripts on file://. Play it from Studio (Builds > Play in the browser), ask the agent for a link (studio_template play), or serve this folder (npx http-server .) and open the address it prints.';
    document.body.append(d);
  });
</script>
<!-- Studio web template sidescroller-2.5d: the gameplay is src/main.js, its settings and assets game.json. -->
<div id="stage"><canvas id="game" data-webgl="1" tabindex="0"></canvas></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
