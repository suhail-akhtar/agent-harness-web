</style>
<!-- Three.js from vendor/three (studio_template vendors it; nothing loads from the network). -->
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>

<!-- Studio web template firstperson-3d: the gameplay is src/main.js, its settings and assets game.json. -->
<div id="stage"><canvas id="game" data-webgl="1" tabindex="0"></canvas><div id="crosshair">+</div></div>
<script type="module" src="src/main.js"></script>
