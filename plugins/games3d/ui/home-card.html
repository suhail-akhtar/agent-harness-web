<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio</title>
<link rel="stylesheet" href="kit.css">
<style>
  body { background: transparent; }
  .item { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; font: inherit; color: inherit; background: transparent; border: 0; border-radius: 8px; padding: 5px 6px; cursor: pointer; }
  .item:hover { background: var(--hx-hover); }
  .item .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
  .foot { display: flex; gap: 8px; margin-top: 8px; }
</style>
<script src="harness://app/sdk/plugin-ui.js"></script>
<script src="kit.js"></script>
</head>
<body class="card-frame">
<div id="out" class="small muted">Loading…</div>
<script>
// Studio on the app's home: the projects worked on last, what is running in the job queue, and
// the Jobs badge kept current while the home is open.
Kit.start(async (harness) => {
  const { h, mount, chip, ago } = Kit;
  const out = document.getElementById('out');
  Kit.autoHeight(harness);
  const load = async () => {
    const s = await Kit.studio(harness, 'summary');
    await harness.badge.set('jobs', s.counts.jobs || null).catch(() => {});
    const running = s.jobs.filter((j) => j.status === 'running' || j.status === 'waiting');
    mount(out,
      s.projects.length ? s.projects.slice(0, 3).map((p) => h('button', { type: 'button', class: 'item', 'data-card-project': p.id, onclick: () => harness.view.open('projects', { project: p.id }) },
        Kit.logo(p.engine, true), h('span', { class: 't' }, p.name, h('span', { class: 'muted' }, p.stage ? ` · ${p.stages.find((x) => x.id === p.stage)?.title || p.stage}` : '')), h('span', { class: 'muted small' }, ago(p.updated))))
        : h('div', { class: 'small muted' }, 'No Studio projects yet.'),
      running.length ? h('div', { style: { marginTop: '6px' } }, running.slice(0, 3).map((j) => h('button', { type: 'button', class: 'item', onclick: () => harness.view.open('jobs') }, h('span', { class: `dot ${j.status === 'running' ? 'info live' : 'warn'}` }), h('span', { class: 't' }, j.title), chip(j.status, j.status)))) : null,
      h('div', { class: 'foot' }, h('button', { type: 'button', class: 'btn sm', onclick: () => harness.view.open('home') }, 'Open Studio'), h('button', { type: 'button', class: 'btn sm ghost', onclick: () => harness.view.open('assets') }, `${s.counts.assets} assets`)));
  };
  await Kit.live(harness, load, { topics: ['sessions'], ms: 30_000 });
});
</script>
</body>
</html>
