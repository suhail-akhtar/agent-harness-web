<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio</title>
<link rel="stylesheet" href="kit.css">
<style>
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .card h2 { margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .card h2 .spacer { flex: 1; }
  .pcard { display: flex; flex-direction: column; gap: 8px; text-align: left; font: inherit; color: inherit; border: 1px solid var(--hx-border-subtle); border-radius: 12px; background: var(--hx-elevated); padding: 13px 14px; cursor: pointer; min-width: 0; }
  .pcard:hover { border-color: var(--hx-border); box-shadow: 0 4px 14px rgba(0,0,0,.06); }
  .pcard .top { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .pcard .nm { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .segs { display: flex; gap: 2px; }
  .segs i { flex: 1; height: 4px; border-radius: 2px; background: var(--hx-pill); }
  .segs i.done { background: var(--hx-success); } .segs i.cur { background: var(--hx-accent); } .segs i.warn { background: var(--hx-warning); }
  .phead { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 14px; }
  .phead .grow { flex: 1; min-width: 240px; }
  .comment { padding: 6px 0; border-top: 1px solid var(--hx-border-subtle); font-size: 12.5px; }
  .comment:first-child { border-top: 0; }
  .doc { max-height: 520px; overflow: auto; }
  .doc.open { max-height: none; }
  .bigprev { border: 1px solid var(--hx-border-subtle); border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 280px; aspect-ratio: 4 / 3; }
  .bigprev img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .bigprev.pixel img { image-rendering: pixelated; width: 100%; height: 100%; }
  .search { max-width: 260px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .kpi { border: 1px solid var(--hx-border-subtle); border-radius: 12px; background: var(--hx-elevated); padding: 10px 12px; }
  .kpi b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .kpi.ok b { color: var(--hx-success); } .kpi.warn b { color: var(--hx-warning); } .kpi.bad b { color: var(--hx-danger); }
  .issue { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--hx-border-subtle); }
  .issue:first-child { border-top: 0; }
  .ev-thumb { width: 88px; height: 54px; border-radius: 7px; overflow: hidden; border: 1px solid var(--hx-border-subtle); background: var(--hx-sidebar); padding: 0; cursor: pointer; }
  .ev-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rgrid .tile .thumb { aspect-ratio: 16 / 10; }
  .rgrid .tile[aria-pressed="true"] { border-color: var(--hx-accent); box-shadow: 0 0 0 1px var(--hx-accent); }
  .pick { position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; border-radius: 50%; background: var(--hx-elevated); border: 1px solid var(--hx-border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
  .tile[aria-pressed="true"] .pick { background: var(--hx-accent); color: var(--hx-on-accent); border-color: transparent; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 980px) { .grid2 { grid-template-columns: 1fr; } }
</style>
<script src="harness://app/sdk/plugin-ui.js"></script>
<script src="kit.js"></script>
<script src="model.js"></script>
</head>
<body>
<div class="page">
  <div class="head">
    <div class="grow"><h1 id="title">Studio</h1><div class="sub" id="sub"></div></div>
    <div class="row" id="actions"></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Studio"></nav>
  <main id="main"><div class="muted">Loading…</div></main>
</div>
<script>
// Studio's pages, one frame for every menu item (the view's id picks the tab): Projects (and a
// project's page), Assets (and an asset's page), Scenes, Renders, Builds (and a build), Playtests
// (and a report), Jobs and Engines. Everything comes from Studio's routes; what changes something
// (approving a stage, cancelling a job, installing an engine) asks first, and agents have the
// same operations as commands (GUIDE.md).
Kit.start(async (harness) => {
  const { h, mount, chip, ago, time } = Kit;
  const tab = String(harness.contribution || '').split(':')[1] || 'projects';
  const params = harness.params || {};
  const main = document.getElementById('main');
  const $ = (id) => document.getElementById(id);
  let settings = {};
  try { settings = (await harness.settings.get()) || {}; } catch { settings = {}; }
  const refreshMs = Math.max(5, Number(settings.refreshSeconds) || 20) * 1000;
  const TABS = [['projects', 'Projects'], ['assets', 'Assets'], ['scenes', 'Scenes'], ['renders', 'Renders'], ['builds', 'Builds'], ['playtests', 'Playtests'], ['jobs', 'Jobs'], ['engines', 'Engines']];
  const route = (p, body) => Kit.studio(harness, p, body ?? {});
  const toast = (text, kind) => harness.notify.toast(String(text).slice(0, 280), { kind: kind || 'info' }).catch(() => {});
  const resultTone = (r) => (r === 'pass' ? 'ok' : r === 'fail' || r === 'crash' ? 'bad' : r === 'timeout' ? 'warn' : '');
  const buildTone = (s) => (s === 'ok' || s === 'success' || s === 'passed' ? 'ok' : s === 'failed' || s === 'error' ? 'bad' : s === 'running' ? 'running' : '');
  const crumbs = (...items) => h('div', { class: 'crumbs' }, items.flatMap((it, i) => [i ? h('span', {}, '›') : null, it.go ? h('button', { type: 'button', onclick: it.go }, it.label) : h('span', {}, it.label)]));
  const empty = (title, text, extra) => h('div', { class: 'card empty', 'data-empty': '' }, h('b', {}, title), text, extra ? h('div', { style: { marginTop: '12px' } }, extra) : null);
  let jobsBusy = false;

  function tabs() {
    const detail = !!(params.project || params.asset || params.id);
    mount($('tabs'), TABS.map(([id, label]) => h('button', { type: 'button', role: 'tab', class: 'tab', 'aria-selected': String(id === tab && !detail), 'data-tab': id, onclick: () => harness.view.open(id) }, label,
      id === 'jobs' && jobsCount ? h('span', { class: 'count hot' }, String(jobsCount)) : null)));
  }
  let jobsCount = 0;
  const setTitle = (t, sub) => { $('title').textContent = t; $('sub').textContent = sub || ''; };
  const setActions = (...els) => mount($('actions'), els);

  // ---------------- projects ----------------
  const segs = (p) => h('div', { class: 'segs', 'aria-hidden': 'true' }, p.stages.map((s) => h('i', { class: ['done', 'approved'].includes(s.status) ? 'done' : s.id === p.stage ? 'cur' : ['review', 'changes-requested'].includes(s.status) ? 'warn' : '' })));
  async function projects() {
    const r = await route('projects');
    setTitle('Projects', `${r.projects.length} project${r.projects.length === 1 ? '' : 's'} in ${r.roots.length} folder${r.roots.length === 1 ? '' : 's'}`);
    setActions(h('button', { type: 'button', class: 'btn primary', onclick: () => harness.view.open('home') }, 'Start a project'));
    if (!r.projects.length) { mount(main, empty('No Studio projects yet', 'A Studio project is a folder with .studio/project.json. Start one from Studio\'s home (a 2D platformer, a 3D game, a model), or ask an agent to make a game in one of your folders.', h('button', { type: 'button', class: 'btn primary', onclick: () => harness.view.open('home') }, 'Quick starts'))); return; }
    mount(main, h('div', { class: 'grid-cards wide', 'data-projects': '' }, r.projects.map((p) => h('button', { type: 'button', class: 'pcard', 'data-project': p.id, onclick: () => harness.view.open('projects', { project: p.id }) },
      h('div', { class: 'top' }, Kit.logo(p.engine), h('div', { style: { minWidth: '0', flex: '1' } }, h('div', { class: 'nm' }, p.name), h('div', { class: 'muted small', style: { whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' } }, p.genre || p.folder))),
      h('div', { class: 'row', style: { gap: '6px' } }, chip(Kit.engineName(p.engine), 'engine'), p.dimension ? chip(p.dimension.toUpperCase()) : null, p.waiting.length ? chip('waits for you', 'review') : null, p.error ? chip('unreadable', 'bad') : null),
      p.stages.length ? h('div', {}, h('div', { class: 'small', style: { marginBottom: '5px' } }, p.stage ? `Stage ${p.stages.findIndex((s) => s.id === p.stage) + 1} of ${p.stages.length}: ${p.stages.find((s) => s.id === p.stage).title || p.stage}` : `All ${p.stages.length} stages done`), segs(p)) : h('div', { class: 'small muted' }, 'No stages yet'),
      h('div', { class: 'row small muted', style: { gap: '12px' } }, h('span', {}, `${p.counts.assets} assets`), h('span', {}, `${p.counts.builds} builds`), h('span', {}, `${p.counts.playtests} playtests`), h('span', { class: 'spacer' }), h('span', {}, ago(p.updated)))))));
  }

  async function projectPage(id) {
    const r = await route('project', { project: id });
    const p = r.project;
    const on = await Kit.engineOn(harness, p.engine);
    setTitle(p.name, [Kit.engineName(p.engine), p.dimension && p.dimension.toUpperCase(), p.genre].filter(Boolean).join(' · '));
    setActions(
      h('button', { type: 'button', class: 'btn', 'data-ask-agent': '', onclick: () => harness.composer.prefill(`Continue the Studio project "${p.name}" in ${p.dir}: read .studio/project.json and its design document, tell me where it stands, then propose the next step.`, { newChat: true }) }, 'Continue with the agent'),
      h('button', { type: 'button', class: 'btn', onclick: () => harness.view.open('assets', { project: p.id }) }, 'Assets'));
    let sel = params.stage || p.stages.find((s) => s.status === 'review')?.id || p.stages.find((s) => !['done', 'approved', 'skipped'].includes(s.status))?.id || p.stages[0]?.id;
    const off = on ? null : h('div', { class: 'note', 'data-engine-off': p.engine, style: { marginBottom: '12px' } }, `Made with ${Kit.engineName(p.engine)}, which is off. This project opens read-only: switch the engine-${p.engine} plugin on to build, run and play it.`);
    const stageBox = h('div', {});
    const drawStages = () => {
      const s = p.stages.find((x) => x.id === sel);
      const text = h('textarea', { rows: 3, placeholder: 'A comment for the agents: what to keep, what to change…', style: { minHeight: '64px' }, 'data-stage-comment': '' });
      const act = async (action) => {
        const comment = text.value.trim();
        if ((action === 'comment' || action === 'request-changes') && !comment) { text.focus(); return; }
        try {
          const res = await route('project/stage', { project: p.id, stage: s.id, action, ...(comment ? { comment } : {}) });
          Object.assign(s, res.stage);
          await toast(res.text, 'success');
          drawStages();
        } catch (e) { await toast(e.message, 'error'); }
      };
      mount(stageBox,
        h('div', { class: 'stages', role: 'tablist', 'data-stages': '' }, p.stages.map((x, i) => h('button', { type: 'button', class: `stage s-${x.status}`, role: 'tab', 'aria-current': String(x.id === sel), 'data-stage': x.id, 'data-status': x.status, onclick: () => { sel = x.id; drawStages(); } },
          h('div', { class: 'n' }, `Stage ${i + 1}`), h('div', { class: 't' }, x.title || x.id), chip(x.status.replace('-', ' '), x.status)))),
        s ? h('div', { class: 'card', style: { marginTop: '10px' }, 'data-stage-detail': s.id },
          h('div', { class: 'row' }, h('b', {}, s.title || s.id), chip(s.status.replace('-', ' '), s.status), s.approvedAt ? h('span', { class: 'muted small' }, `approved ${ago(s.approvedAt)}${s.approvedBy ? ` by ${s.approvedBy}` : ''}`) : null),
          s.note ? h('div', { class: 'small', style: { marginTop: '6px', whiteSpace: 'pre-wrap' } }, s.note) : null,
          s.comments.length ? h('div', { style: { marginTop: '8px' } }, s.comments.map((c) => h('div', { class: 'comment', 'data-comment': '' }, h('b', {}, c.by), h('span', { class: 'muted small' }, ` · ${c.at ? ago(c.at) : ''}`), h('div', { style: { whiteSpace: 'pre-wrap' } }, c.text)))) : null,
          on ? h('div', { style: { marginTop: '10px' } }, text,
            h('div', { class: 'row', style: { marginTop: '8px', justifyContent: 'flex-end' } },
              h('button', { type: 'button', class: 'btn', 'data-stage-action': 'comment', onclick: () => act('comment') }, 'Comment'),
              ['approved', 'done'].includes(s.status) ? h('button', { type: 'button', class: 'btn', 'data-stage-action': 'reopen', onclick: () => act('reopen') }, 'Reopen')
                : [h('button', { type: 'button', class: 'btn', 'data-stage-action': 'request-changes', onclick: () => act('request-changes') }, 'Request changes'),
                  h('button', { type: 'button', class: 'btn primary', 'data-stage-action': 'approve', onclick: () => act('approve') }, 'Approve')])) : null) : null);
    };
    if (p.stages.length) drawStages(); else mount(stageBox, h('div', { class: 'muted small' }, 'No stages in .studio/project.json yet: the make-game workflow writes them (brief, design, prototype, vertical slice, content, polish, package, playtest).'));
    const budgets = Object.entries(p.budgets || {});
    const designCard = h('section', { class: 'card', 'data-design': '' }, h('h2', {}, 'Design document', h('span', { class: 'spacer' }), r.design ? h('span', { class: 'muted small mono' }, r.design.path) : null),
      r.design?.text ? (() => { const d = h('div', { class: 'doc' }, Kit.markdown(r.design.text)); return [d, r.design.text.length > 3000 ? h('button', { type: 'button', class: 'btn sm ghost', onclick: (e) => { d.classList.toggle('open'); e.target.textContent = d.classList.contains('open') ? 'Show less' : 'Show all'; } }, 'Show all') : null]; })()
        : h('div', { class: 'muted small' }, r.design?.error ? `Not readable: ${r.design.error}` : 'No design document yet (design/GDD.md, or "design" in project.json).'));
    const buildsCard = h('section', { class: 'card', 'data-project-builds': '' }, h('h2', {}, 'Builds', h('span', { class: 'spacer' }), p.builds.length ? h('button', { type: 'button', class: 'btn sm ghost', onclick: () => harness.view.open('builds', { project: p.id }) }, 'All') : null),
      p.builds.length ? [...p.builds].reverse().slice(0, 6).map((b) => h('button', { type: 'button', class: 'item', style: { display: 'flex', gap: '8px', width: '100%', border: '0', background: 'transparent', padding: '6px 0', cursor: 'pointer', font: 'inherit', color: 'inherit', textAlign: 'left' }, 'data-build': b.id, onclick: () => harness.view.open('builds', { project: p.id, id: b.id }) },
        chip(b.status, buildTone(b.status)), h('span', { style: { flex: '1' } }, b.id, h('span', { class: 'muted small' }, ` · ${b.platform}`)), h('span', { class: 'muted small' }, b.at ? ago(b.at) : ''))) : h('div', { class: 'muted small' }, 'No builds yet.'));
    const testsCard = h('section', { class: 'card', 'data-project-playtests': '' }, h('h2', {}, 'Playtests', h('span', { class: 'spacer' }), r.playtests.length ? h('button', { type: 'button', class: 'btn sm ghost', onclick: () => harness.view.open('playtests', { project: p.id }) }, 'All') : null),
      r.playtests.length ? r.playtests.slice(0, 6).map((t) => h('button', { type: 'button', style: { display: 'flex', gap: '8px', width: '100%', border: '0', background: 'transparent', padding: '6px 0', cursor: 'pointer', font: 'inherit', color: 'inherit', textAlign: 'left' }, 'data-playtest': t.folder, onclick: () => harness.view.open('playtests', { project: p.id, id: t.folder }) },
        chip(t.result, resultTone(t.result)), h('span', { style: { flex: '1', minWidth: '0', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, t.goal || t.id), h('span', { class: 'muted small' }, `${t.issues.length} issue${t.issues.length === 1 ? '' : 's'}`))) : h('div', { class: 'muted small' }, 'No playtests yet.'));
    const budgetCard = budgets.length ? h('section', { class: 'card' }, h('h2', {}, 'Budgets'), h('dl', { class: 'kv' }, budgets.flatMap(([k, v]) => [h('dt', {}, k), h('dd', {}, Kit.num(v))]))) : null;
    const meta = h('section', { class: 'card' }, h('h2', {}, 'Project'), h('dl', { class: 'kv' },
      h('dt', {}, 'Folder'), h('dd', { class: 'mono' }, p.dir), h('dt', {}, 'Engine'), h('dd', {}, Kit.engineName(p.engine), p.engineProject ? h('span', { class: 'muted mono' }, ` ${p.engineProject}`) : null),
      p.created ? [h('dt', {}, 'Created'), h('dd', {}, time(p.created))] : null, h('dt', {}, 'Updated'), h('dd', {}, ago(p.updated))));
    const assetsCard = h('section', { class: 'card', 'data-project-assets': '' }, h('h2', {}, `Assets (${r.assets.length})`, h('span', { class: 'spacer' }), r.assets.length ? h('button', { type: 'button', class: 'btn sm ghost', onclick: () => harness.view.open('assets', { project: p.id }) }, 'Open in Assets') : null),
      r.assets.length ? h('div', { class: 'grid-cards' }, r.assets.slice(0, 12).map(assetTile)) : h('div', { class: 'muted small' }, 'No assets in .studio/assets yet.'));
    mount(main, h('div', { 'data-project-page': p.id },
      crumbs({ label: 'Projects', go: () => harness.view.open('projects') }, { label: p.name }), off,
      h('section', { class: 'card', style: { marginBottom: '14px' } }, h('h2', {}, 'Stages'), stageBox),
      h('div', { class: 'grid2' }, h('div', { class: 'stack' }, designCard), h('div', { class: 'stack' }, meta, buildsCard, testsCard, budgetCard)),
      h('div', { style: { marginTop: '14px' } }, assetsCard)));
  }

  // ---------------- assets ----------------
  function assetThumb(a) {
    const pixel = a.dimension === '2d' || ['sprite', 'spritesheet', 'tileset', 'texture', 'ui'].includes(a.kind);
    const box = h('div', { class: `thumb ${pixel ? 'pixel checker' : ''}` });
    const args = Kit.assetArgs(a);
    if (a.preview) box.append(Kit.img(harness, { ...args, path: a.preview }));
    else if (a.model) { box.append(Kit.glyph('box', 'drawing…')); window.Studio3D.thumbnail(harness, { ...args, path: a.model }, 320, 240).then((t) => mount(box, h('img', { src: t.url, alt: '', 'data-model-thumb': '' })), (e) => mount(box, Kit.glyph('box', e.message.slice(0, 60)))); }
    else box.append(Kit.glyph(Kit.kindIcon(a.kind), a.kind === 'audio' || a.kind === 'music' ? Kit.secs(a.meta.durationS) : ''));
    if (a.checksFailed) box.append(h('span', { class: 'badge' }, chip(`${a.checksFailed} check${a.checksFailed === 1 ? '' : 's'} fail`, 'bad')));
    return box;
  }
  function assetTile(a) {
    return h('button', { type: 'button', class: 'tile', 'data-asset': a.ref, 'data-kind': a.kind, onclick: () => harness.view.open('assets', { asset: a.ref }) }, assetThumb(a),
      h('div', { class: 'body' }, h('div', { class: 'name', title: a.name }, a.name), h('div', { class: 'meta' }, [a.kind, a.dimension, a.license.id, a.library ? 'library' : a.projectName].filter(Boolean).join(' · '))));
  }
  const filter = { kind: params.kind, dimension: params.dimension, style: params.style, license: params.license, source: params.source, q: params.q, project: params.project };
  async function assets() {
    const want = Object.fromEntries(Object.entries(filter).filter(([, v]) => v));
    const r = await route('assets', want);
    setTitle('Assets', `${r.total} asset${r.total === 1 ? '' : 's'}${Object.keys(want).length ? ' match' : ''} · projects and the shared library`);
    setActions(h('button', { type: 'button', class: 'btn', onclick: () => harness.composer.prefill('Make a game asset with Studio: ', { newChat: true }) }, 'Make an asset'));
    const facet = (key, label) => {
      const list = r.facets[key] || [];
      if (!list.length) return null;
      return h('div', { class: 'facet', 'data-facet': key }, h('h3', {}, label), h('button', { type: 'button', 'aria-pressed': String(!filter[key]), onclick: () => { filter[key] = undefined; void refresh(); } }, 'Any'),
        list.map((f) => h('button', { type: 'button', 'aria-pressed': String(filter[key] === f.value), 'data-value': f.value, onclick: () => { filter[key] = filter[key] === f.value ? undefined : f.value; void refresh(); } }, f.value, h('span', { class: 'n' }, String(f.count)))));
    };
    const search = h('input', { type: 'text', class: 'search', placeholder: 'Search names, tags, styles', value: filter.q || '', 'aria-label': 'Search assets' });
    let t;
    search.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { filter.q = search.value.trim() || undefined; void refresh().then(() => { const s = document.querySelector('.search'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }); }, 300); });
    mount(main, h('div', { class: 'layout' },
      h('aside', { class: 'facets', 'aria-label': 'Filters' }, facet('kind', 'Kind'), facet('dimension', 'Dimension'), facet('style', 'Style'), facet('license', 'License'), facet('source', 'Source'),
        filter.project ? h('div', { class: 'facet' }, h('h3', {}, 'Project'), h('button', { type: 'button', 'aria-pressed': 'true', onclick: () => { filter.project = undefined; void refresh(); } }, filter.project === 'library' ? 'Library' : 'This project', h('span', { class: 'n' }, '×'))) : null),
      h('div', {}, h('div', { class: 'row', style: { marginBottom: '12px' } }, search, h('span', { class: 'spacer' }), h('span', { class: 'muted small' }, `${r.assets.length} shown`)),
        r.assets.length ? h('div', { class: 'grid-cards', 'data-assets': '' }, r.assets.map(assetTile))
          : empty(r.all ? 'Nothing matches' : 'No assets yet', r.all ? 'Try another filter.' : 'Assets live in each project\'s .studio/assets/<id>/ (and the shared library in ~/.harness/assets), each with an asset.json: what it is, its files, where it came from and its license.'))));
  }

  async function assetPage(ref) {
    const { asset: a } = await route('asset', { asset: ref, ...(params.project ? { project: params.project } : {}) });
    setTitle(a.name, [a.kind, a.dimension && a.dimension.toUpperCase(), a.style].filter(Boolean).join(' · '));
    const args = Kit.assetArgs(a);
    const openers = [];

  }

  async function playtestPage(project, id) {

      h('div', { class: 'kpis', style: { marginBottom: '14px' } },
        h('div', { class: `kpi ${resultTone(t.result)}`, 'data-result': t.result }, h('b', {}, t.result), h('span', { class: 'muted small' }, 'result')),
        kpi('duration', t.durationS, ' s'), kpi('steps', t.steps, ''),
        kpi('FPS (average)', m.fpsAvg, '', bud.fps && m.fpsAvg !== undefined ? m.fpsAvg >= bud.fps * 0.95 : undefined),
        kpi('frame ms (p95)', m.frameMsP95, ' ms', bud.frameMs && m.frameMsP95 !== undefined ? m.frameMsP95 <= bud.frameMs * 1.2 : undefined),
        kpi('memory', m.memoryMb, ' MB', bud.memoryMb && m.memoryMb !== undefined ? m.memoryMb <= bud.memoryMb : undefined),
        kpi('errors', m.errors, '', m.errors === undefined ? undefined : m.errors === 0)),
      h('section', { class: 'card', style: { marginBottom: '14px' } }, h('h2', {}, 'Timeline', h('span', { class: 'spacer' }), h('span', { class: 'muted small' }, `${t.events.length} events · ${frames.length} frames`)), tl,
        h('div', { class: 'grid2', style: { marginTop: '12px' } }, h('div', {}, big, caption), h('div', {}, h('div', { class: 'small', style: { fontWeight: '500', marginBottom: '4px' } }, 'Frames'), strip,
          t.recording ? h('div', { style: { marginTop: '10px' }, 'data-recording': t.recording }, h('div', { class: 'small', style: { fontWeight: '500', marginBottom: '4px' } }, 'Recording'), h('div', { class: 'bigframe' }, Kit.img(harness, { project, path: t.recording }, { alt: 'The recording of the playthrough' }))) : null))),

          h('details', { class: 'card' }, h('summary', { class: 'small', style: { fontWeight: '600', cursor: 'pointer' } }, `Events (${t.events.length})`), h('table', { style: { marginTop: '8px' } }, h('tbody', {}, t.events.map((e) => h('tr', { class: 'click', onclick: () => show(e.frame || frameAt(e.t), e.t, `${e.type}: ${e.detail}`) }, h('td', { class: 'num muted' }, Kit.secs(e.t)), h('td', {}, chip(e.type, EVENT_TONE[e.type] || '')), h('td', {}, e.detail))))))))));

  // ---------------- jobs ----------------
  async function jobs() {
    const r = await route('jobs');
    jobsCount = r.running; jobsBusy = r.running > 0;
    await harness.badge.set('jobs', r.running || null).catch(() => {});
    tabs();
    setTitle('Jobs', r.running ? `${r.running} running or waiting · one per engine at a time` : 'The heavy-job queue: renders, builds, cooks, bakes and long plays');
    setActions();
    if (!r.jobs.length) { mount(main, empty('No jobs in the last hour', 'Renders, builds, cooks, bakes and long plays queue here, one per engine at a time (HARNESS_ENGINE_JOBS raises it), each with a timeout and a cancel.')); return; }
    mount(main, h('table', { 'data-jobs': '' }, h('thead', {}, h('tr', {}, ['', 'Job', 'Engine', 'Queued', 'Took', ''].map((t, i) => h('th', { class: i === 4 ? 'num' : '' }, t)))),
      h('tbody', {}, r.jobs.map((j) => h('tr', { 'data-job': j.id, 'data-status': j.status },
        h('td', {}, chip(j.status, j.status === 'running' ? 'running' : j.status === 'waiting' ? 'waiting' : j.status === 'done' ? 'ok' : 'bad')),
        h('td', {}, h('b', {}, j.title), h('div', { class: 'muted small mono' }, j.id)), h('td', {}, h('span', { class: 'row', style: { gap: '6px' } }, Kit.logo(j.engine, true), Kit.engineName(j.engine))),
        h('td', { class: 'muted small' }, ago(j.queuedAt)), h('td', { class: 'num' }, j.took !== undefined ? Kit.dur(0, j.took) : '—'),
        h('td', {}, j.status === 'running' || j.status === 'waiting' ? h('button', { type: 'button', class: 'btn sm', 'data-cancel': j.id, onclick: async () => {
          if (!(await Kit.confirm('Cancel this job?', `${j.title}\n\nIt stops now; what it wrote so far stays.`, 'Cancel the job'))) return;
          try { const x = await route('jobs/cancel', { id: j.id }); await toast(x.text, 'success'); await refresh(); } catch (e) { await toast(e.message, 'error'); }
        } }, 'Cancel') : null))))));
  }

  // ---------------- engines ----------------
  const INSTALL = {
    godot: { how: 'agent', label: 'Install Godot 4', prompt: 'Install Godot 4 for Studio: use the Godot engine tool\'s install action (the official build into ~/.harness/engines, checksums verified). Ask me before downloading anything, then run detect and tell me what it found.', body: 'The agent downloads the official Godot 4 build into ~/.harness/engines (it asks you again before downloading), then checks it.' },
    blender: { how: 'agent', label: 'Install Blender', prompt: 'Install Blender for Studio: use the Blender engine tool\'s install action if it has one, else tell me the exact command for this system (winget, brew or the official download) and wait for me to run it. Then run detect.', body: 'The agent installs Blender, or tells you the one command to run (it asks before anything is downloaded).' },
    unreal: { how: 'person', label: 'Get Unreal Engine', url: 'https://www.unrealengine.com/en-US/download', body: 'Unreal Engine is installed by you with the Epic Games Launcher (its EULA is yours to accept). Studio finds it in the usual folders, or set HARNESS_UNREAL to its folder.' },

  };
  async function engines(refreshNow) {
    const r = await route('engines', refreshNow ? { refresh: true } : {});

    const cards = [];
    for (const e of r.engines) {
      const plugin = e.plugin && e.plugin !== 'games3d' ? await harness.registry.has({ plugin: e.plugin }).catch(() => false) : true;
      const inst = INSTALL[e.engine];
      const install = async () => {
        if (!(await Kit.confirm(inst.label, inst.body, inst.how === 'agent' ? 'Ask the agent' : 'Open the download page'))) return;
        try { if (inst.how === 'agent') await harness.composer.prefill(inst.prompt, { newChat: true }); else await harness.external.open(inst.url); } catch (err) { await toast(err.message, 'error'); }
      };

        h('div', { style: { minWidth: '0' } },
          h('div', { class: 'row' }, h('b', { style: { fontSize: '14px' } }, e.title), e.installed ? chip(e.version && e.engine !== 'web' ? e.version : 'installed', 'ok') : chip('not installed'), e.gaps.length && e.installed ? chip('limited', 'warn') : null,

        h('div', { class: 'stack', style: { alignItems: 'flex-end', display: 'flex', flexDirection: 'column', gap: '6px' } },
